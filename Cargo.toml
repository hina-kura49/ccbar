[package]
name = "ccbar"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Claude Code の 5時間枠・7日枠の消費率を macOS のメニューバーに出す"
repository = "https://github.com/hina-kura49/ccbar"

[dependencies]
jiff = { version = "1.0.1", default-features = false, features = ["std", "tz-system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
